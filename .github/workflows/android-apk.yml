name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_BASE_URL: http://192.168.0.55:8002

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_SERVICES_JSON" ]]; then
            echo "GOOGLE_SERVICES_JSON repository secret is required" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install mobile dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Allow the local development backend
        shell: bash
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'usesCleartextTraffic' "$manifest"; then
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$manifest"
          fi

      - name: Build release APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DOCDO-android.apk
          sha256sum DOCDO-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOCDO-android-apk
          path: mobile/DOCDO-android.apk
          if-no-files-found: error
          retention-days: 7
